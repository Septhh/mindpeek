<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Floating nav on scroll — identical behaviour to the main page
        const topNav = document.getElementById('top-nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                topNav.classList.add('is-floating');
            } else {
                topNav.classList.remove('is-floating');
            }
        });

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const showRegisterBtn = document.getElementById('show-register');
        const showLoginBtn = document.getElementById('show-login');
        const navRegisterBtn = document.getElementById('nav-register-btn');
        const navLoginBtn = document.getElementById('nav-login-btn');
        const modalTitle = document.getElementById('modal-title');
        const feedbackEl = document.getElementById('form-feedback');

        function setNavActive(target) {
            if (target === 'login') {
                navLoginBtn.className = 'px-6 py-2 rounded-full font-label-md text-label-md transition-all duration-300 active:scale-95 shadow-sm soft-shadow bg-primary text-on-primary hover:bg-primary/90';
                navRegisterBtn.className = 'px-6 py-2 rounded-full font-label-md text-label-md transition-all duration-300 active:scale-95 border border-primary text-primary hover:bg-primary/5';
            } else {
                navRegisterBtn.className = 'px-6 py-2 rounded-full font-label-md text-label-md transition-all duration-300 active:scale-95 shadow-sm soft-shadow bg-secondary text-on-secondary hover:bg-secondary/90';
                navLoginBtn.className = 'px-6 py-2 rounded-full font-label-md text-label-md transition-all duration-300 active:scale-95 border border-secondary text-secondary hover:bg-secondary/5';
            }
        }

        function showLogin() {
            registerForm.classList.remove('form-active');
            registerForm.classList.add('form-hidden');
            loginForm.classList.remove('form-hidden');
            loginForm.classList.add('form-active');
            modalTitle.textContent = 'Masuk ke SerenityPath';
            modalTitle.className = 'font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight transition-colors duration-300';
            setNavActive('login');
        }

        function showRegister() {
            loginForm.classList.remove('form-active');
            loginForm.classList.add('form-hidden');
            registerForm.classList.remove('form-hidden');
            registerForm.classList.add('form-active');
            modalTitle.textContent = 'Daftar SerenityPath';
            modalTitle.className = 'font-headline-lg-mobile text-headline-lg-mobile text-secondary tracking-tight transition-colors duration-300';
            setNavActive('register');
        }

        function toggleForms() {
            feedbackEl.classList.add('hidden');
            feedbackEl.className = 'hidden mb-4 p-3 rounded-xl text-center font-label-md transition-all duration-300';

            const isLoginVisible = loginForm.classList.contains('form-active');
            if (isLoginVisible) {
                showRegister();
            } else {
                showLogin();
            }
        }

        showRegisterBtn.addEventListener('click', toggleForms);
        showLoginBtn.addEventListener('click', toggleForms);
        navRegisterBtn.addEventListener('click', () => {
            feedbackEl.classList.add('hidden');
            showRegister();
        });
        navLoginBtn.addEventListener('click', () => {
            feedbackEl.classList.add('hidden');
            showLogin();
        });

        // Handle initial state from URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('state') === 'register' || window.location.hash === '#register') {
            showRegister();
        } else {
            setNavActive('login');
        }

        function showFeedback(message, type) {
            feedbackEl.textContent = message;
            feedbackEl.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'bg-primary-container', 'text-on-primary-container', 'bg-surface-container', 'text-on-surface');

            if (type === 'success') {
                feedbackEl.classList.add('bg-primary-container', 'text-on-primary-container');
            } else if (type === 'error') {
                feedbackEl.classList.add('bg-error-container', 'text-on-error-container');
            } else {
                feedbackEl.classList.add('bg-surface-container', 'text-on-surface');
            }
        }

        function setLoading(btn, isLoading, originalText) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<span class="loader"></span> Loading...`;
                btn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                btn.disabled = false;
                btn.innerHTML = `<span>${originalText}</span>`;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                showFeedback('Please fill in all fields.', 'error');
                return;
            }

            const payload = { action: 'login', email, password };
            console.log('API Request Payload:', payload);

            const btn = document.getElementById('login-submit');
            setLoading(btn, true, 'Sign In');
            feedbackEl.classList.add('hidden');

            // Simulate API call
            setTimeout(() => {
                setLoading(btn, false, 'Sign In');
                showFeedback('Login successful! Redirecting...', 'success');
                // Reset form optional
                // loginForm.reset();
            }, 1500);
        });

        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const dob = document.getElementById('register-dob').value.trim();
            const education = document.getElementById('register-education').value.trim();
            const password = document.getElementById('register-password').value.trim();

            if (!name || !email || !dob || !education || !password) {
                showFeedback('Please fill in all fields.', 'error');
                return;
            }

            const payload = { action: 'register', name, email, dob, education, password };
            console.log('API Request Payload:', payload);

            const btn = document.getElementById('register-submit');
            setLoading(btn, true, 'Sign Up');
            feedbackEl.classList.add('hidden');

            // Simulate API call
            setTimeout(() => {
                setLoading(btn, false, 'Sign Up');
                showFeedback('Registration successful! Please sign in.', 'success');
                registerForm.reset();
                setTimeout(() => {
                    showLogin();
                }, 2000);
            }, 1500);
        });
    });
    </script>
